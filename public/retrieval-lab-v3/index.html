<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language Retrieval Lab V3</title><style>body{margin:0;background:#fff8ed;color:#17213f;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:34px 20px 70px}h1{font-size:clamp(34px,7vw,56px);line-height:1.06;color:#0f1b3d;margin:8px 0 14px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:22px}.card,.panel{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:18px}.card{cursor:pointer;text-align:left}.chip{display:inline-block;background:#eef4ff;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.btn{border:0;border-radius:11px;padding:13px 18px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#f59e0b;color:#0f1b3d}.dark{background:#0f1b3d;color:#fff}.recording{background:#b42318;color:#fff}.ghost{background:transparent;border:1px solid #d6d3d1;color:#667085}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.barbg{height:7px;background:#e9dfd0;border-radius:99px;overflow:hidden;margin:20px 0 28px}.bar{height:100%;background:#f59e0b}.phase{font-size:12px;font-weight:850;color:#f59e0b;text-transform:uppercase;letter-spacing:1.2px}.scenario{font-size:18px;line-height:1.5;color:#667085}.prompt{font-size:clamp(28px,6vw,46px);line-height:1.08;color:#0f1b3d;margin:12px 0 22px}.ok{border-left:5px solid #15803d}.warn{border-left:5px solid #f59e0b}.heard{border-left:5px solid #2563eb;background:#f7faff}.model{background:#fff7df;border-color:#f5d487}.hint{background:#fff7df;border:1px solid #f5d487;border-radius:14px;padding:14px 16px;margin-top:12px}textarea{width:100%;box-sizing:border-box;border:1px solid #d6d3d1;border-radius:11px;padding:12px;font:inherit}.result{background:#0f1b3d;color:white;min-height:100vh}.result .wrap{max-width:900px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{background:#172554;border-radius:15px;padding:18px}.metric strong{display:block;font-size:28px;margin:7px 0}.small{font-size:13px;color:#667085}.status{margin-top:12px;font-size:14px;font-weight:700}</style></head><body><div id="app"></div><script>
const modules=[
{id:'used',level:'B1',name:'Раньше было, теперь нет',form:'used to + verb',target:t=>t.includes('used to '),items:[
['You quit smoking five years ago.','Correct a friend who thinks you never smoked.',['I used to smoke.','I used to smoke, but I quit years ago.'],['smoke']],
['You live in the city now. As a child you lived near the sea.','Describe the old situation.',['I used to live by the sea.','I used to live near the coast.'],['live','sea|coast']],
['These days you drive to work. Years ago you went by bike every day.','Describe the old routine.',['I used to go to work by bike.','I used to cycle to work.','I used to ride my bike to work.'],['bike|cycle','work|there']],
['There is a supermarket here now. Ten years ago this building was a cinema.','Explain the change.',['There used to be a cinema here.','This used to be a cinema.'],['cinema']],
['You sleep well now. In your twenties you often worked at night.','Describe the old habit.',['I used to work nights.','I used to work at night a lot.'],['work','night|nights']],
['You wear contact lenses now. Before that you wore glasses.','Answer naturally.',['I used to wear glasses.','I used to wear glasses before I got contacts.'],['glasses']]]},
{id:'have',level:'A2',name:'Нужно / не обязательно',form:'have to / don’t have to',target:t=>t.includes('have to ')||t.includes("don't have to ")||t.includes('do not have to '),items:[
['The lift is broken. Your office is on the 12th floor.','Tell a colleague what is necessary.',['We have to take the stairs.','We need to use the stairs.'],['stairs']],
['Tomorrow is a holiday. The office is closed.','Say that coming in is not necessary.',["You don't have to come in tomorrow.","You don't need to come in tomorrow."],['come|work','tomorrow']],
['Your train leaves at 6:10 a.m.','Say what you need to do.',['I have to get up early.','I need to get up early.'],['early']],
['Jackets are optional at the restaurant.','Explain what that means.',["You don't have to wear a jacket.","You don't need to wear a jacket."],['jacket']],
['You promised to send the documents before lunch.','Say what you need to do this morning.',['I have to send the documents this morning.','I need to send them before lunch.'],['send','documents|them|files']],
['Museum entry is free and booking is optional.','Say that booking is not necessary.',["We don't have to book online.","We don't need to book in advance."],['book']]]},
{id:'just',level:'A2',name:'Только что сделал',form:'have/has just + V3',target:t=>(t.includes("'ve just ")||t.includes(' have just ')||t.includes(' has just ')||t.includes("'s just ")),items:[
['Your colleague asks if the report is ready. You finished it one minute ago.','Answer naturally.',["I've just finished the report.","I've just finished it."],['finish|finished|done|completed']],
['You walk in carrying coffee. A friend offers to buy you one.','Respond naturally.',["I've just bought one.","I've just got a coffee."],['bought|got','one|coffee']],
['Someone calls as you leave the station. The train arrived moments ago.','Say what happened.',['The train has just arrived.',"It's just arrived."],['arrived']],
['Anna learned the news seconds ago because you told her.','Answer naturally.',["I've just told her.","I've just told Anna."],['told']],
['Your laptop battery is full. You finished charging it moments ago.','Say what you have done.',["I've just charged it.","I've just finished charging the laptop."],['charged|charging']],
['Your flatmate asks why the kitchen smells nice. You made dinner moments ago.','Answer naturally.',["I've just made dinner.","I've just cooked dinner."],['dinner']]]},
{id:'going',level:'B1',name:'Собирался, но…',form:'was/were going to + verb',target:t=>t.includes(' was going to ')||t.startsWith('was going to ')||t.includes(' were going to '),items:[
['You planned to call Tom last night, but you fell asleep.','Explain what happened.',['I was going to call Tom, but I fell asleep.','I was going to phone him, but I fell asleep.'],['call|phone','sleep|asleep']],
['You planned to cook, but friends invited you out.','Explain the change of plan.',['I was going to cook, but my friends invited me out.','I was going to make dinner, but we went out instead.'],['cook|dinner','out|friends']],
['You planned to take the train, but it was cancelled.','Tell someone your original plan.',['I was going to take the train, but it was cancelled.','I was going to go by train, but it got cancelled.'],['train','cancel']],
['You nearly sent an angry email, but decided to wait.','Explain the plan you changed.',['I was going to send the email, but I decided to wait.','I was going to reply, but I thought better of it.'],['email|reply','wait|decided']],
['You planned to buy a new phone, but repaired the old one.','Explain what changed.',['I was going to buy a new phone, but I fixed the old one.','I was going to replace my phone, but I had it repaired.'],['phone','buy|replace']],
['You planned to leave early, but the meeting finished late.','Explain why you stayed.',['I was going to leave early, but the meeting ran late.','I was going to go early, but the meeting finished late.'],['early','meeting|late']]]},
{id:'should',level:'B1',name:'Надо было сделать',form:'should have + V3',target:t=>t.includes('should have ')||t.includes("should've ")||t.includes("shouldn't have "),items:[
['Your phone died because you forgot to charge it.','Say what would have been better.',['I should have charged my phone.','I should’ve charged it before I left.'],['charge|charged','phone|it']],
['You arrived late because you left home too late.','Say what would have been better.',['I should have left earlier.','I should’ve left home earlier.'],['left|leave','earlier|early']],
['You bought the cheapest laptop and regret it.','Say what you think now.',['I should have bought the better one.','I should’ve spent a bit more.'],['bought|spent','better|more']],
['You told a private story and it was repeated.','Say what was a mistake.',["I shouldn't have told him.","I shouldn't have said anything."],['told|said']],
['You got soaked after ignoring the forecast.','Say what would have been better.',['I should have checked the forecast.','I should’ve taken an umbrella.'],['forecast|umbrella|weather']],
['You lost changes because you made no backup.','Say what you should have done.',['I should have saved a backup.','I should’ve made a copy.'],['backup|copy']]]},
{id:'wish',level:'B2',name:'Сожаление о прошлом',form:'wish + had + V3',target:t=>t.includes('wish i had ')||t.includes("wish i'd ")||t.includes("wish i hadn't "),items:[
['You stayed up until 2 a.m. and missed an interview.','Express your regret.',["I wish I'd gone to bed earlier.","I wish I hadn't stayed up so late."],['bed|sleep|stayed','earlier|late']],
['You turned down a good job last year and regret it.','Express that regret.',["I wish I'd taken that job.",'I wish I had accepted the offer.'],['job|offer','taken|accepted']],
['You sold your old car and now miss it.','Express the regret.',["I wish I hadn't sold my old car.","I wish I'd kept my old car."],['car','sold|kept']],
['You did not learn French at school and need it now.','Express the regret.',["I wish I'd learned French at school.",'I wish I had studied French earlier.'],['french','learned|studied']],
['You booked a very expensive flight at the last minute.','Express the regret.',["I wish I'd booked earlier.","I wish I hadn't waited so long."],['booked|waited','earlier|long']],
['You ignored good advice and now regret it.','Express the regret.',["I wish I'd listened to you.",'I wish I had taken your advice.'],['listened|advice']]]}
];
let current=null,step=0,answers=[],retry=0,hint=false,voiceState='idle',lastHeard='',lastSource='',recognition=null,lastVoiceMsg='';
const app=document.getElementById('app');
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cueOK(text,cues){return cues.every(group=>group.split('|').some(x=>text.includes(x)))}
function renderLibrary(){current=null;try{recognition&&recognition.abort()}catch{} recognition=null;voiceState='idle';lastHeard='';lastSource='';lastVoiceMsg='';app.innerHTML='<div class="wrap"><div class="phase">Language Retrieval Lab V3</div><h1>Тренировочный станок для retrieval.</h1><p class="muted">6 конструкций · по 6 ситуаций. Без свободных монологов. Правильный естественный ответ не должен запускать лишний круг.</p><div class="grid">'+modules.map((m,i)=>'<button class="card" data-i="'+i+'"><span class="chip">'+m.level+'</span><strong>'+m.name+'</strong><div class="muted" style="margin-top:7px">'+m.form+'</div></button>').join('')+'</div></div>';document.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(+b.dataset.i))}
function start(i){current=modules[i];step=0;answers=[];retry=0;hint=false;voiceState='idle';lastHeard='';lastSource='';lastVoiceMsg='';renderPractice()}
function transcriptBox(){if(!lastHeard)return '';const label=lastSource==='voice'?'Машина распознала':'Ты написал';return '<div class="panel heard"><b>'+label+'</b><div style="font-size:20px;margin-top:8px">“'+esc(lastHeard)+'”</div></div>'}
function renderPractice(msg){const item=current.items[step];const pct=(step/current.items.length)*100;const listening=voiceState==='listening';const voiceLabel=listening?'■ Слушаю…':'🎙 Ответить голосом';const voiceClass=listening?'btn recording':'btn dark';const status=listening?'<div class="status" style="color:#b42318">Микрофон включён. Говори — после распознавания текст появится в рамке ниже.</div>':lastVoiceMsg?'<div class="status" style="color:#b42318">'+esc(lastVoiceMsg)+'</div>':'';app.innerHTML='<div class="wrap"><button class="btn ghost" id="back">← Библиотека</button><div class="barbg"><div class="bar" style="width:'+pct+'%"></div></div><div class="phase">'+(step===0?'Cold retrieval':step===5?'Delayed probe':'Varied retrieval')+' · '+(step+1)+'/6</div><div class="scenario">'+item[0]+'</div><div class="prompt">'+item[1]+'</div>'+(hint?'<div class="hint"><b>Минимальная подсказка</b><div style="margin-top:6px">Используй идею: <code>'+current.form+'</code></div></div>':'')+transcriptBox()+(msg||'')+'<div id="inputArea"><div class="actions"><button class="'+voiceClass+'" id="voice">'+voiceLabel+'</button><button class="btn ghost" id="type">Или напечатать</button></div>'+status+'<div id="typed" style="display:none;margin-top:12px"><textarea id="ta" rows="3" placeholder="Your answer…"></textarea><button class="btn primary" id="check" style="margin-top:9px">Проверить</button></div></div></div>';document.getElementById('back').onclick=renderLibrary;document.getElementById('type').onclick=()=>{document.getElementById('typed').style.display='block'};document.getElementById('check').onclick=()=>submit(document.getElementById('ta').value,'typed');document.getElementById('voice').onclick=voice}
function submit(raw,source='voice'){const original=String(raw||'').trim();const text=norm(original);if(!text)return;lastHeard=original;lastSource=source;lastVoiceMsg='';voiceState='idle';const item=current.items[step];const target=current.target(' '+text+' ');const meaning=cueOK(text,item[3]);const accepted=target&&meaning;answers.push({accepted,target,meaning,retry,text});if(accepted){const variants=item[2].map(x=>'<div>• '+x+'</div>').join('');const box='<div class="panel ok"><b>Принято</b><div style="margin-top:6px">Смысл передан и нужная конструкция использована.</div><div class="small" style="margin-top:6px">'+(retry===0?'Самостоятельно, без подсказки.':'После подсказки.')+'</div></div><div class="panel model"><b>Рекомендуемые варианты</b><div style="margin-top:8px">'+variants+'</div></div><div class="actions"><button class="btn primary" id="next">'+(step===5?'Показать итог':'Дальше →')+'</button></div>';renderPractice(box);document.getElementById('inputArea').style.display='none';document.getElementById('next').onclick=next;return}
if(target&&!meaning){const box='<div class="panel warn"><b>Конструкция распознана</b><div style="margin-top:6px">Но смысл задания пока не подтверждён достаточно уверенно. Попробуй уточнить ответ.</div></div>';retry++;hint=true;renderPractice(box);return}
const box='<div class="panel warn"><b>Попробуем ещё раз</b><div style="margin-top:6px">Нужная конструкция пока не появилась.</div></div>';retry++;hint=true;renderPractice(box)}
function next(){try{recognition&&recognition.abort()}catch{} recognition=null;voiceState='idle';lastHeard='';lastSource='';lastVoiceMsg='';if(step<5){step++;retry=0;hint=false;renderPractice()}else renderResult()}
function renderResult(){const first=answers.filter(a=>a.retry===0);const independent=first.filter(a=>a.accepted).length;app.innerHTML='<div class="result"><div class="wrap"><div class="phase" style="color:#fbbf24">V3 · '+current.name+'</div><h1 style="color:white">Итог тренировки</h1><div class="metrics"><div class="metric"><span>Самостоятельно с первой попытки</span><strong>'+independent+'/6</strong><span>без forced retry</span></div><div class="metric"><span>Всего ситуаций</span><strong>6</strong><span>без свободного монолога</span></div></div><div class="actions"><button class="btn primary" id="again">К библиотеке</button></div></div></div>';document.getElementById('again').onclick=renderLibrary}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){lastVoiceMsg='Этот браузер не поддерживает встроенное распознавание речи. Используй текстовый ввод.';renderPractice();document.getElementById('typed').style.display='block';return}
if(recognition&&voiceState==='listening'){try{recognition.stop()}catch{}return}
lastVoiceMsg='';lastHeard='';lastSource='';let gotResult=false;const r=new SR();recognition=r;r.lang='en-US';r.interimResults=false;r.continuous=false;r.maxAlternatives=1;r.onstart=()=>{voiceState='listening';renderPractice()};r.onresult=e=>{gotResult=true;const x=e.results[e.results.length-1];const t=x&&x[0]&&x[0].transcript?x[0].transcript.trim():'';recognition=null;voiceState='idle';if(t)submit(t,'voice');else{lastVoiceMsg='Речь не удалось распознать. Попробуй ещё раз.';renderPractice()}};r.onnomatch=()=>{lastVoiceMsg='Не удалось разобрать фразу. Попробуй ещё раз.'};r.onerror=e=>{recognition=null;voiceState='idle';const code=e&&e.error?e.error:'unknown';lastVoiceMsg='Голосовой ввод не сработал ('+code+'). Можно повторить или напечатать ответ.';renderPractice()};r.onend=()=>{recognition=null;if(!gotResult&&voiceState==='listening'){voiceState='idle';if(!lastVoiceMsg)lastVoiceMsg='Запись закончилась, но текст не получен. Нажми кнопку и повтори.';renderPractice()}};try{r.start()}catch(e){recognition=null;voiceState='idle';lastVoiceMsg='Не удалось включить микрофон. Проверь разрешение браузера или используй текст.';renderPractice()}}
renderLibrary();
</script></body></html>
