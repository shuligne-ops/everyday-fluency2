<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Français au Quotidien · Retrieval Lab V2</title>
<style>
:root{--navy:#0f1b3d;--amber:#f59e0b;--pale:#fff8ed;--ink:#17213f;--muted:#667085;--green:#15803d;--red:#b42318;--line:#eadfce;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:930px;margin:0 auto;padding:42px 20px 72px}.kicker{text-transform:uppercase;letter-spacing:1.2px;font-size:12px;font-weight:850;color:var(--amber)}h1{font-size:clamp(34px,7vw,54px);line-height:1.08;margin:10px 0 18px;color:var(--navy)}h2{color:var(--navy)}p{line-height:1.55}.lead{font-size:17px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:24px}.card{border:1px solid var(--line);background:white;border-radius:14px;padding:16px}.skill{cursor:pointer;text-align:left;width:100%;font:inherit}.chip{display:inline-block;background:#eef4ff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;color:var(--navy)}.btn{border:0;border-radius:10px;background:var(--amber);color:var(--navy);padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}.btn.navy{background:var(--navy);color:white}.btn.ghost{background:transparent;border:1px solid #d6d3d1;color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.scenario,.hint,.feedback,.model{border-radius:14px;padding:16px;margin-top:16px}.scenario{border:1px solid var(--line);background:white;font-size:17px}.hint{border:1px solid #f5d487;background:#fff7df}.feedback{border:1px solid var(--line);background:white}.model{border:1px solid #f5d487;background:#fff7df}.answer{margin-top:20px}.answer blockquote{margin:8px 0;font-size:19px}.muted{color:var(--muted)}textarea{width:100%;min-height:90px;border:1px solid #d6d3d1;border-radius:10px;padding:12px;font:inherit}.result{background:var(--navy);color:white;min-height:100vh}.result h1{color:white}.result .card{background:#172554;border:0;color:white;display:grid;gap:8px}.result .summary{background:#111c3f;border:1px solid #334155;border-radius:14px;padding:18px;margin-top:16px}.small{font-size:12px;color:var(--muted)}.result .small{color:#cbd5e1}.progress{height:5px;background:#eadfce;border-radius:9px;overflow:hidden;margin:18px 0 28px}.progress>div{height:100%;background:var(--amber)}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none}.warn{color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const C={green:'#15803d',amber:'#f59e0b',red:'#b42318',blue:'#2563eb'};
const PK='ef_fr_static_v2_progress',SK='ef_fr_static_v2_session';
const skills=[
{id:'obligation',level:'A2',name:'Нужно / не обязательно',form:'il faut / devoir / ne pas avoir besoin de',meaning:'Обязанность и отсутствие необходимости.',target:/\b(il faut|je dois|tu dois|on doit|nous devons|vous devez|ils doivent|pas besoin de|pas oblige de|pas obligee de|pas obliges de)\b/i,partial:/\b(faut|dois|doit|devons|devez|doivent|besoin|oblige)\b/i,h1:'Передай необходимость или отсутствие необходимости.',h2:'Используй il faut / devoir; для «не обязательно» — ne pas avoir besoin de / ne pas être obligé de.',free:'Parle de deux choses que tu dois faire cette semaine et d’une chose que tu n’es pas obligé de faire.',d:[
['cold','L’ascenseur est en panne et ton bureau est au douzième étage.','Dis à ton collègue que prendre l’escalier est nécessaire.',['Il faut prendre l’escalier.','On doit prendre l’escalier aujourd’hui.'],[['escalier'],['faut','doit','devons']]],
['runway','Demain, c’est férié et le bureau est fermé.','Dis à ton collègue que venir n’est pas nécessaire.',["Tu n’as pas besoin de venir demain.","Tu n’es pas obligé de venir demain."],[['demain'],['venir'],['besoin','oblige']]],
['varied','Ton train part à 6 h 10 demain matin.','Explique que te lever tôt est nécessaire.',['Je dois me lever tôt demain.','Il faut que je me lève tôt demain.'],[['lever'],['tot'],['dois','faut']]],
['contrast','Au restaurant, la veste est facultative.','Dis à ton ami qu’il n’est pas nécessaire d’en porter une.',["Tu n’es pas obligé de porter une veste.","Tu n’as pas besoin de mettre une veste."],[['veste'],['porter','mettre'],['besoin','oblige']]],
['transfer','Tu as promis d’envoyer les documents avant midi.','Explique que tu dois les envoyer ce matin.',['Je dois envoyer les documents ce matin.','Il faut que je les envoie avant midi.'],[['envoyer'],['documents'],['matin','midi']]],
['delayed','L’entrée du musée est gratuite et la réservation est facultative.','Dis qu’il n’est pas nécessaire de réserver.',["On n’a pas besoin de réserver.","On n’est pas obligés de réserver à l’avance."],[['reserver'],['besoin','oblige']]]]},
{id:'venir_de',level:'A2',name:'Только что сделал',form:'venir de + infinitif',meaning:'Действие произошло совсем недавно.',target:/\b(viens|vient|venons|venez|viennent)\s+(de|d')\s*\w+/i,partial:/\b(viens|vient|venons|venez|viennent)\b/i,h1:'Событие произошло буквально только что.',h2:'Используй venir de + infinitif.',free:'Dis trois choses que tu viens de faire aujourd’hui.',d:[
['cold','Ton collègue demande si le rapport est prêt. Tu l’as fini il y a une minute.','Réponds naturellement.',["Je viens de finir le rapport.","Je viens de le terminer."],[['finir','termine','rapport'],['viens']]],
['runway','Tu arrives au bureau avec un café. Un ami t’en propose un.','Dis que tu en as acheté un il y a un instant.',["Je viens d’en acheter un.","Je viens de prendre un café."],[['acheter','prendre'],['cafe','un'],['viens']]],
['varied','Quelqu’un t’appelle au moment où tu sors de la gare.','Dis que le train est arrivé il y a un instant.',['Le train vient d’arriver.','Il vient juste d’arriver.'],[['train','il'],['arriver'],['vient']]],
['contrast','Anna demande si tu connais la nouvelle. On vient de te la dire.','Réponds naturellement.',["On vient de me le dire.","Je viens d’apprendre la nouvelle."],[['dire','apprendre'],['viens','vient']]],
['transfer','Ta batterie est pleine maintenant.','Dis que tu as fini de la recharger il y a un instant.',["Je viens de la recharger.","Je viens de finir de charger mon ordinateur."],[['charger','recharger'],['viens']]],
['delayed','Ton colocataire demande pourquoi ça sent bon.','Dis que tu as préparé le dîner à l’instant.',["Je viens de préparer le dîner.","Je viens de faire à manger."],[['diner','manger','preparer'],['viens']]]]},
{id:'en_train_de',level:'B1',name:'Прямо сейчас в процессе',form:'être en train de + infinitif',meaning:'Действие идёт прямо сейчас.',target:/\b(suis|es|est|sommes|etes|sont)\s+en train de\s+\w+/i,partial:/\ben train de\b/i,h1:'Подчеркни, что действие идёт прямо сейчас.',h2:'Используй être en train de + infinitif.',free:'Décris trois choses que des gens autour de toi sont en train de faire.',d:[
['cold','Un ami t’appelle pendant que tu cuisines.','Dis ce que tu fais exactement maintenant.',["Je suis en train de cuisiner.","Je suis en train de préparer le dîner."],[['cuisiner','preparer','diner'],['suis','train']]],
['runway','Tu ne peux pas répondre parce que tu conduis.','Explique pourquoi.',["Je suis en train de conduire.","Je conduis là, je te rappelle."],[['conduire'],['suis','train']]],
['varied','Paul parle au téléphone au moment où tu entres.','Explique ce qu’il fait.',["Paul est en train de téléphoner.","Il est en train de parler au téléphone."],[['paul','il'],['telephone','telephoner'],['est','train']]],
['contrast','Marie a commencé un rapport et travaille dessus maintenant.','Dis ce qu’elle fait.',["Elle est en train d’écrire un rapport.","Marie est en train de travailler sur le rapport."],[['rapport'],['ecrire','travailler'],['est','train']]],
['transfer','Des ouvriers travaillent devant la maison.','Explique ce qui se passe.',["Ils sont en train de réparer la maison.","Ils sont en train de faire des travaux."],[['reparer','travaux'],['maison'],['sont','train']]],
['delayed','Ton frère ne répond pas: il passe un examen maintenant.','Explique pourquoi.',["Il est en train de passer un examen.","Il est en train de faire son examen."],[['examen'],['passer','faire'],['est','train']]]]},
{id:'allais',level:'B1',name:'Собирался, но…',form:'j’allais + infinitif, mais…',meaning:'План в прошлом, который изменился.',target:/\b(allais|allait|allions|alliez|allaient)\b.*\bmais\b/i,partial:/\b(allais|allait|allions|alliez|allaient)\b/i,h1:'Сначала был план, потом что-то его изменило.',h2:'Используй j’allais / on allait + infinitif, mais…',free:'Raconte deux projets récents qui ont changé au dernier moment.',d:[
['cold','Tu avais prévu d’appeler Tom hier soir, mais tu t’es endormi.','Explique ce qui s’est passé.',["J’allais appeler Tom, mais je me suis endormi.","J’allais lui téléphoner, mais je me suis endormi."],[['appeler','telephoner'],['tom','lui'],['endormi'],['allais','mais']]],
['runway','Tu avais prévu de cuisiner, mais tes amis t’ont invité au restaurant.','Explique le changement de plan.',["J’allais cuisiner, mais mes amis m’ont invité au restaurant.","J’allais préparer le dîner, mais finalement on est sortis."],[['cuisiner','diner'],['restaurant','sortis'],['allais']]],
['varied','Tu avais prévu de prendre le train, mais il a été annulé.','Explique ton plan initial.',["J’allais prendre le train, mais il a été annulé.","J’allais partir en train, mais il a été supprimé."],[['train'],['annule','supprime'],['allais','mais']]],
['contrast','Tu étais sur le point d’envoyer un mail énervé, puis tu as décidé d’attendre.','Explique ce que tu comptais faire.',["J’allais envoyer le mail, mais j’ai décidé d’attendre.","J’allais répondre, mais j’ai préféré attendre."],[['mail','repondre'],['attendre'],['allais','mais']]],
['transfer','Tu avais prévu d’acheter un nouveau téléphone, mais tu as réparé l’ancien.','Explique ce qui a changé.',["J’allais acheter un nouveau téléphone, mais j’ai réparé l’ancien.","J’allais changer de téléphone, mais j’ai fait réparer l’ancien."],[['telephone'],['acheter','changer'],['repare'],['allais']]],
['delayed','Tu avais prévu de partir tôt, mais la réunion a fini tard.','Explique pourquoi tu es resté.',["J’allais partir tôt, mais la réunion a fini tard.","J’allais partir plus tôt, mais la réunion s’est terminée tard."],[['partir'],['tot'],['reunion','tard'],['allais','mais']]]]},
{id:'aurais_du',level:'B1',name:'Надо было сделать',form:'j’aurais dû + infinitif',meaning:'Оценка прошлого: правильнее было поступить иначе.',target:/\b(aurais|aurait|aurions|auriez|auraient)\b.*\bdu\b\s+\w+/i,partial:/\b(aurais|aurait|aurions|auriez|auraient)\b.*\bdu\b/i,h1:'Ты оцениваешь прошлое задним числом.',h2:'Используй conditionnel passé de devoir: j’aurais dû + infinitif.',free:'Raconte deux choses que tu aurais dû faire différemment cette semaine.',d:[
['cold','Ton téléphone s’est éteint pendant le voyage parce que tu ne l’avais pas chargé.','Dis ce que tu aurais mieux fait de faire.',["J’aurais dû charger mon téléphone hier.","J’aurais dû le recharger avant de partir."],[['charger','recharger'],['telephone'],['aurais','du']]],
['runway','Vous avez raté le train parce que vous êtes partis trop tard.','Dis ce que vous auriez dû faire.',["On aurait dû partir plus tôt.","Nous aurions dû partir plus tôt."],[['partir'],['tot'],['aurait','aurions','du']]],
['varied','Tu as acheté un billet très cher au dernier moment.','Dis ce que tu aurais dû faire.',["J’aurais dû acheter le billet plus tôt.","J’aurais dû réserver plus tôt."],[['acheter','reserver'],['billet'],['aurais','du']]],
['contrast','Tu as dit quelque chose de blessant à un ami.','Regrette cette décision.',["Je n’aurais pas dû dire ça.","Je n’aurais pas dû lui parler comme ça."],[['dire','parler'],['pas'],['aurais','du']]],
['transfer','Tu as oublié ton parapluie et il pleut.','Dis ce qu’il aurait mieux valu faire.',["J’aurais dû prendre un parapluie.","J’aurais dû regarder la météo."],[['parapluie','meteo'],['aurais','du']]],
['delayed','Tu as perdu un fichier important sans sauvegarde.','Dis ce que tu aurais dû faire.',["J’aurais dû faire une sauvegarde.","J’aurais dû enregistrer une copie."],[['sauvegarde','copie','enregistrer'],['aurais','du']]]]},
{id:'si_mixte',level:'B2',name:'Прошлое → результат сейчас',form:'si + plus-que-parfait, conditionnel présent',meaning:'Нереальная причина в прошлом и её результат сейчас.',target:/\bsi\b.*\b(avais|avait|avions|aviez|avaient|etais|etait|etions|etiez|etaient)\b.*\b\w+(rais|rait|rions|riez|raient)\b/i,partial:/\bsi\b.*\b(avais|avait|avions|aviez|avaient|etais|etait|etions|etiez|etaient)\b/i,h1:'Причина была в прошлом, результат — сейчас.',h2:'Après si: plus-que-parfait. Résultat actuel: conditionnel présent.',free:'Imagine deux décisions passées qui auraient changé ta situation actuelle.',d:[
['cold','Tu t’es couché à deux heures et maintenant tu es épuisé.','Explique le lien entre hier et maintenant.',["Si je m’étais couché plus tôt, je ne serais pas aussi fatigué maintenant.","Si j’avais dormi davantage, je me sentirais mieux maintenant."],[['couche','dormi'],['fatigue','mieux'],['si']]],
['runway','Elle n’a jamais appris le français; aujourd’hui elle ne peut pas parler avec le client.','Explique la conséquence actuelle.',["Si elle avait appris le français, elle pourrait parler avec le client maintenant.","Si elle avait étudié le français, elle pourrait lui parler aujourd’hui."],[['francais'],['client','lui'],['pourrait'],['si']]],
['varied','Tu as refusé un emploi l’an dernier et tu travailles toujours ici.','Imagine la situation contraire.',["Si j’avais accepté cet emploi, je ne travaillerais pas ici aujourd’hui.","Si j’avais pris ce poste, je serais ailleurs maintenant."],[['emploi','poste'],['ici','ailleurs'],['si']]],
['contrast','Tu as dépensé toutes tes économies et aujourd’hui tu ne peux pas voyager.','Explique le lien.',["Si je n’avais pas tout dépensé, je pourrais voyager maintenant.","Si j’avais économisé davantage, j’aurais plus de possibilités aujourd’hui."],[['depense','economise'],['voyager','possibilites'],['si']]],
['transfer','Vous n’avez pas commencé plus tôt et maintenant vous êtes pressés.','Explique le lien.',["Si on avait commencé plus tôt, on ne serait pas pressés maintenant.","Si nous avions commencé plus tôt, nous aurions plus de temps maintenant."],[['commence'],['presse','temps'],['si']]],
['delayed','Tu as raté le train et maintenant tu n’es toujours pas chez toi.','Explique ce qui serait différent.',["Si je n’avais pas raté le train, je serais déjà chez moi.","Si j’avais pris ce train, je serais à la maison maintenant."],[['train'],['chez moi','maison'],['si']]]]}];

let state={view:'library',skillId:skills[0].id,idx:0,retry:0,events:[],progress:load(PK,{})};
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim()}
function skill(){return skills.find(x=>x.id===state.skillId)||skills[0]}function drill(){return skill().d[state.idx]}
function scoreMeaning(d,text){const t=norm(text);let hits=0;for(const g of d[5])if(g.some(x=>t.includes(norm(x))))hits++;const r=hits/Math.max(1,d[5].length);return r>=.72?2:r>=.34?1:0}
function evalAns(text){const s=skill(),d=drill(),t=norm(text),target=s.target.test(t)?2:s.partial.test(t)?1:0,m=scoreMeaning(d,text),first=state.retry===0;let out='MEANING_MISS';if(m===2&&target===2)out=first?'TARGET_INDEPENDENT':'TARGET_SUPPORTED';else if(m===2)out='MEANING_ALTERNATIVE';else if(m===1)out='MEANING_PARTIAL';else if(target>0)out='TARGET_NEEDS_REPAIR';return{text,m,target,out,first,phase:d[0],i:state.idx}}
function feedback(o){return o==='TARGET_INDEPENDENT'?['Смысл и нужная форма получились','Самостоятельно, без подсказки.',C.green]:o==='TARGET_SUPPORTED'?['Получилось с поддержкой','Полезная практика, но не самостоятельный retrieval.',C.blue]:o==='MEANING_ALTERNATIVE'?['Смысл передан естественно','Но сейчас тренируем другой способ выразить эту мысль.',C.amber]:o==='MEANING_PARTIAL'?['Смысл передан частично','Уточним смысл и попробуем ещё раз.',C.amber]:o==='TARGET_NEEDS_REPAIR'?['Форма появилась, но смысл съехал','Сохраним форму и поправим содержание.',C.amber]:['Пока не получилось','Сначала поправим смысл, не раскрывая готовый ответ.',C.red]}
function render(){const a=document.getElementById('app');if(state.view==='library'){const due=skills.filter(s=>state.progress[s.id]&&new Date(state.progress[s.id].due)<=Date.now()).length;a.innerHTML=`<main><div class=wrap><div class=kicker>Français au Quotidien · Retrieval Lab V2</div><h1>Смысл → французская форма → self-repair → transfer.</h1><p class=lead>Параллельная французская версия: 6 конструкций A2–B2. Ситуации по-французски, минимальные подсказки, повторная попытка до model answer и delayed review.</p><div class=row><button class=btn id=rec>Начать рекомендуемую →</button></div><p class=small>На повтор сегодня: ${due}. Просроченные навыки идут раньше новых.</p><div class=grid>${skills.map(s=>`<button class="card skill" data-id="${s.id}"><span class=chip>${state.progress[s.id]?'Продолжить':'Новый'}</span><span style="float:right" class=small>${s.level}</span><h2>${s.name}</h2><p class=muted>${s.meaning}</p><code>${s.form}</code></button>`).join('')}</div></div></main>`;document.querySelectorAll('.skill').forEach(b=>b.onclick=()=>start(b.dataset.id));document.getElementById('rec').onclick=()=>{const dueS=skills.find(s=>state.progress[s.id]&&new Date(state.progress[s.id].due)<=Date.now());const fresh=skills.find(s=>!state.progress[s.id]);start((dueS||fresh||skills[0]).id)};return}
if(state.view==='result'){const ev=state.events,first=ev.filter(e=>e.first),ind=first.filter(e=>e.out==='TARGET_INDEPENDENT').length,meaning=first.filter(e=>e.m===2).length,del=[...ev].reverse().find(e=>e.phase==='delayed'),sup=ev.filter(e=>e.out==='TARGET_SUPPORTED').length;a.innerHTML=`<main class=result><div class=wrap><div class=kicker>FR V2 · ${skill().name}</div><h1>Что действительно получилось без подсказки?</h1><div class=grid><div class=card><small>Смысл с первой попытки</small><strong>${meaning}/${first.length}</strong><span>мысль соответствовала ситуации</span></div><div class=card><small>Нужная форма сама</small><strong>${ind}/${first.length}</strong><span>без подсказки</span></div><div class=card><small>Delayed-in-session probe</small><strong>${del&&del.out==='TARGET_INDEPENDENT'?'Получился':'Не подтверждён'}</strong><span>самый важный сигнал внутри сессии</span></div><div class=card><small>С поддержкой</small><strong>${sup}</strong><span>полезная практика, но не mastery evidence</span></div></div><div class=summary><strong>Сохранение навыка ещё не доказано.</strong><p class=small>Следующая короткая проверка — позже, в новом контексте.</p></div><button class=btn id=done style="margin-top:20px">Закончить</button></div></main>`;document.getElementById('done').onclick=()=>{state.view='library';render()};return}
const s=skill(),d=drill(),last=state.events.filter(e=>e.i===state.idx).slice(-1)[0],fb=last?feedback(last.out):null,ok=last&&(last.out==='TARGET_INDEPENDENT'||last.out==='TARGET_SUPPORTED'),reveal=last&&!ok&&state.retry>=2;a.innerHTML=`<main><div class=wrap><button class="btn ghost" id=back>← Библиотека</button><div class=progress><div style="width:${((state.idx+1)/s.d.length)*100}%"></div></div><div class=kicker>${d[0]}</div><h2>${s.name}</h2><div class=scenario>${d[1]}</div><h1 style="font-size:clamp(28px,6vw,42px)">${d[2]}</h1>${state.retry?`<div class=hint><b>${state.retry===1?'Минимальная подсказка':'Более явная подсказка'}</b><p>${state.retry===1?s.h1:s.h2}</p>${state.retry>=2?`<code>${s.form}</code>`:''}</div>`:''}${!last?`<div class=row style="margin-top:24px"><button class="btn navy" id=voice>🎙 Ответить по-французски</button><button class="btn ghost" id=type>Или напечатать</button></div><div id=typed class=hidden style="margin-top:14px"><textarea id=txt placeholder="Réponse en français…"></textarea><button class=btn id=check style="margin-top:8px">Проверить</button></div><p id=err class=warn></p>`:`<div class=answer><div class=card><small>Ты сказал</small><blockquote>«${escapeHtml(last.text)}»</blockquote></div><div class=feedback style="border-left:5px solid ${fb[2]}"><strong>${fb[0]}</strong><p>${fb[1]}</p></div>${!ok&&state.retry<2?`<button class=btn id=retry style="margin-top:12px">Попробовать ещё раз с подсказкой →</button>`:''}${ok||reveal?`<div class=model><small>Рекомендуемый вариант</small><p><b>«${d[3][0]}»</b></p><small>Также естественно</small><p>«${d[3][1]}»</p></div><button class=btn id=next style="margin-top:12px">${state.idx<s.d.length-1?'Дальше →':'Показать итог →'}</button>`:''}</div>`}</div></main>`;document.getElementById('back').onclick=()=>{state.view='library';render()};if(!last){document.getElementById('type').onclick=()=>document.getElementById('typed').classList.toggle('hidden');document.getElementById('check').onclick=()=>submit(document.getElementById('txt').value);document.getElementById('voice').onclick=voice}else{if(document.getElementById('retry'))document.getElementById('retry').onclick=()=>{state.retry++;render()};if(document.getElementById('next'))document.getElementById('next').onclick=()=>{if(state.idx<s.d.length-1){state.idx++;state.retry=0;render()}else finish()}}}
function start(id){state={...state,view:'practice',skillId:id,idx:0,retry:0,events:[]};save(SK,state);render()}function submit(text){if(!text.trim())return;const e=evalAns(text);state.events.push(e);save(SK,state);render()}function finish(){const delayed=[...state.events].reverse().find(e=>e.phase==='delayed'),pass=delayed&&delayed.out==='TARGET_INDEPENDENT',old=state.progress[state.skillId]||{successes:0},successes=old.successes+(pass?1:0),days=!pass?1:successes<=1?1:successes===2?3:successes===3?7:14;state.progress[state.skillId]={successes,due:new Date(Date.now()+days*86400000).toISOString()};save(PK,state.progress);localStorage.removeItem(SK);state.view='result';render()}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('typed').classList.remove('hidden');document.getElementById('err').textContent='Голосовой ввод не поддерживается. Используй текст.';return}const r=new SR();r.lang='fr-FR';r.interimResults=false;r.continuous=false;r.onresult=e=>{const t=e.results[e.results.length-1][0].transcript;submit(t)};r.onerror=()=>{document.getElementById('typed').classList.remove('hidden');document.getElementById('err').textContent='Голосовой ввод не сработал. Используй текст.'};r.start()}
