<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language Practice Lab — 6 modules</title><style>
:root{--navy:#0f1b3d;--navy2:#172554;--amber:#f59e0b;--cream:#fff8ed;--ink:#17213f;--muted:#667085;--line:#e8ddcb;--green:#15803d;--red:#b42318;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:34px 22px 74px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--amber)}h1{font-size:clamp(38px,7vw,64px);line-height:1.03;color:var(--navy);margin:10px 0 14px}.lead{font-size:18px;line-height:1.55;color:var(--muted);max-width:820px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:26px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.card{cursor:pointer;text-align:left}.chip,.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef4ff;font-size:11px;font-weight:900;color:var(--navy)}.card strong{display:block;font-size:20px;color:var(--navy);margin-top:11px}.small{font-size:13px;color:var(--muted);line-height:1.45}.btn{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:850;cursor:pointer}.btn.primary{background:var(--amber);color:var(--navy)}.btn.dark{background:var(--navy);color:#fff}.btn.ghost{background:transparent;border:1px solid #d6d3d1;color:var(--muted)}.btn.red{background:var(--red);color:#fff}.progress{height:8px;border-radius:999px;background:#e9dfd0;overflow:hidden;margin:22px 0 34px}.progress>div{height:100%;background:var(--amber)}.stage{font-size:13px;font-weight:900;color:var(--amber);letter-spacing:1px;text-transform:uppercase}.scenario{font-size:19px;line-height:1.5;color:var(--muted);margin-top:14px}.prompt{font-size:clamp(32px,6vw,50px);line-height:1.08;color:var(--navy);margin:12px 0 24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.transcript{margin-top:18px;background:#f7faff;border:1px solid #bfd3ff;border-left:5px solid var(--blue);border-radius:16px;padding:18px;min-height:98px}.transcript .title{font-weight:850;color:var(--navy)}.transcript .text{font-size:21px;line-height:1.45;margin-top:8px}.transcript .placeholder{color:#8a94a6;font-size:16px}.status{margin-top:10px;font-size:14px;font-weight:800}.status.starting{color:#9a6700}.status.listening,.status.error{color:var(--red)}textarea{width:100%;min-height:110px;border:1px solid #d6d3d1;border-radius:12px;padding:12px;font:inherit;resize:vertical;background:#fff}.feedback.accept{border-left:5px solid var(--green)}.feedback.note{border-left:5px solid var(--blue)}.feedback.repair{border-left:5px solid var(--amber)}.feedback h3{margin:0;color:var(--navy);font-size:22px}.feedback p{margin:8px 0 0;line-height:1.5}.models{background:#fff7df;border-color:#f5d487}.models .example{font-size:20px;line-height:1.45;margin-top:8px}.hint{margin-top:16px;background:#fff7df;border:1px solid #f5d487;border-radius:16px;padding:16px}.darkpage{min-height:100vh;background:var(--navy);color:#fff}.darkpage h1{color:#fff}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}.metric{background:var(--navy2);border-radius:17px;padding:20px}.metric .label{font-size:16px;color:#e5e7eb}.metric strong{display:block;font-size:36px;margin:8px 0}.metric .desc{font-size:14px;color:#cbd5e1;line-height:1.45}.summary{margin-top:18px;background:#111c3f;border:1px solid #334155;border-radius:17px;padding:20px;line-height:1.6}.typing{margin-top:14px}
</style></head><body><div id="app"></div><script src="data.js"></script><script>
const app=document.getElementById('app'),modules=window.LAB_MODULES||[];
let s={view:'library',module:null,index:0,attempt:0,hint:0,events:[],feedback:null,typed:false,voice:'idle',transcript:'',interim:'',voiceMessage:'',rec:null,timer:null};
const norm=x=>String(x||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const esc=x=>String(x||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function targetOK(kind,t){return kind==='used'?/\bused to\s+\w+/i.test(t):kind==='have'?/\b(have|has|had) to\b|\b(don't|doesn't|didn't|do not|does not|did not) have to\b/i.test(t):kind==='just'?/\b(have|has|'ve|'s)\s+just\s+\w+/i.test(t):kind==='going'?/\b(was|were)\s+going to\s+\w+/i.test(t):kind==='should'?/\bshould(n't| not)?\s+(have|'ve)\s+\w+/i.test(t):/\bwish\b.*\b(had|hadn't|had not|'d)\b.*\w+/i.test(t)}
function cueHits(t,cues){return cues.filter(g=>g.split('|').some(x=>t.includes(norm(x)))).length}
function stageName(i){return i===0?'Первая попытка без подсказки':i===5?'Финальная проверка без подсказки':i===3?'Похожая ситуация':i===4?'Другой контекст':'Новая ситуация'}
function evaluate(m,item,raw){const t=norm(raw),target=targetOK(m.target,t),hits=cueHits(t,item[3]),meaning=hits>=Math.max(1,Math.ceil(item[3].length/2));if(item[4]==='positive-obligation'&&/\b(must|have to)\b/.test(t)&&!/\b(don't|do not|needn't|don't need to|do not need to)\b/.test(t))return{kind:'repair',title:'Смысл получился противоположным',body:'Здесь нужно сказать «не обязательно», а не «обязательно».'};if(target&&meaning)return{kind:'accept',title:'Принято',body:'Смысл передан и нужная конструкция использована.',independent:s.attempt===0};if(target&&!meaning)return{kind:'note',title:'Принято',body:'Нужная конструкция использована. Формулировка отличается от ожидаемой, но лишний повторный круг не нужен.',independent:s.attempt===0};return{kind:'repair',title:'Попробуем ещё раз',body:'Сейчас тренируем именно эту конструкцию. Дадим небольшую подсказку.'}}
function resetVoice(){try{s.rec&&s.rec.abort()}catch{}s.rec=null;clearTimeout(s.timer);s.timer=null;s.voice='idle';s.interim='';s.voiceMessage=''}
function render(){s.view==='library'?library():s.view==='result'?result():practice()}
function library(){resetVoice();app.innerHTML=`<div class="wrap"><div class="eyebrow">Экспериментальный тренажёр</div><h1>Шесть модулей. Один принцип: быстро вспомнить нужную конструкцию.</h1><p class="lead">Без свободных монологов и непонятных технических терминов. После каждого ответа ты видишь, что именно распознала система. Правильный естественный ответ не отправляется на лишний круг.</p><div class="grid">${modules.map((m,i)=>`<button class="card" data-i="${i}"><span class="chip">${m.level}</span><strong>${m.name}</strong><div class="small" style="margin-top:7px">${m.form}</div></button>`).join('')}</div></div>`;document.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(+b.dataset.i))}
function start(i){resetVoice();s={...s,view:'practice',module:modules[i],index:0,attempt:0,hint:0,events:[],feedback:null,typed:false,voice:'idle',transcript:'',interim:'',voiceMessage:'',rec:null,timer:null};render()}
function transcript(){const live=s.interim||s.transcript;let body='Нажми «Ответить голосом». Здесь сразу появится то, что услышала система.';if(s.voice==='starting')body='Подключаю микрофон… Пока не говори.';if(s.voice==='listening'&&!live)body='Микрофон включён. Говори — текст появится здесь по мере распознавания.';if(live)body='“'+esc(live)+'”';return `<div class="transcript"><div class="title">Что распознала система</div><div class="${live?'text':'placeholder'}">${body}</div></div>`}
function practice(){const m=s.module,item=m.items[s.index],pct=(s.index/m.items.length)*100,label=s.voice==='starting'?'● Подключаю микрофон…':s.voice==='listening'?'■ Слушаю — говори':'🎙 Ответить голосом',cls=s.voice==='starting'||s.voice==='listening'?'btn red':'btn dark',status=s.voice==='starting'?'<div class="status starting">Пока не говори. Дождись надписи «Слушаю — говори».</div>':s.voice==='listening'?'<div class="status listening">Микрофон включён.</div>':s.voiceMessage?'<div class="status error">'+esc(s.voiceMessage)+'</div>':'';app.innerHTML=`<div class="wrap"><div class="top"><button class="btn ghost" id="back">← Библиотека</button><span class="badge">${s.index+1}/6</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="stage">${stageName(s.index)}</div>${s.index===5?'<div class="small" style="margin-top:7px">Проверяем, всплывает ли конструкция сама после нескольких других примеров.</div>':''}<div class="scenario">${item[0]}</div><div class="prompt">${item[1]}</div>${s.hint?`<div class="hint"><b>${s.hint===1?'Небольшая подсказка':'Форма конструкции'}</b><div style="margin-top:6px">${s.hint===1?'Смысл оставь тем же; попробуй перестроить форму.':'<code>'+m.form+'</code>'}</div></div>`:''}${transcript()}${s.feedback?feedback(item):input(label,cls,status)}</div>`;document.getElementById('back').onclick=()=>{s.view='library';render()};if(!s.feedback)wireInput()}
function input(label,cls,status){return `<div class="actions"><button id="voice" class="${cls}">${label}</button><button id="type" class="btn ghost">Или напечатать</button></div>${status}<div class="typing" style="display:${s.typed?'block':'none'}"><textarea id="ta" placeholder="Your answer…"></textarea><button id="check" class="btn primary" style="margin-top:9px">Проверить</button></div>`}
function feedback(item){const e=s.feedback,cls=e.kind==='repair'?'repair':e.kind==='note'?'note':'accept';return `<div class="panel feedback ${cls}" style="margin-top:16px"><h3>${e.title}</h3><p>${e.body}</p>${e.independent?'<div class="small" style="margin-top:8px">Самостоятельно, без подсказки.</div>':''}</div>${e.kind==='repair'?`<div class="hint"><b>Попробуй ещё раз</b><div style="margin-top:6px">${s.attempt===0?'Смысл оставь тем же; попробуй перестроить форму.':'Используй: <code>'+s.module.form+'</code>'}</div></div><div class="actions"><button id="retry" class="btn primary">Попробовать ещё раз →</button>${s.attempt>=1?'<button id="show" class="btn ghost">Показать варианты</button>':''}</div>`:`<div class="panel models" style="margin-top:14px"><b>Рекомендуемые варианты</b>${item[2].map(x=>`<div class="example">• ${esc(x)}</div>`).join('')}</div><div class="actions"><button id="next" class="btn primary">${s.index===5?'Показать итог':'Дальше →'}</button></div>`}`}
function wireInput(){document.getElementById('type').onclick=()=>{s.typed=true;practice()};const c=document.getElementById('check');if(c)c.onclick=()=>{const v=document.getElementById('ta').value.trim();if(v)submit(v,'typed')};document.getElementById('voice').onclick=()=>{if(s.voice==='starting'||s.voice==='listening'){try{s.rec&&s.rec.stop()}catch{};return}voice()}}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){s.voiceMessage='В этом браузере голосовое распознавание недоступно. Используй ввод текста.';s.typed=true;practice();return}resetVoice();s.voice='starting';s.transcript='';s.interim='';practice();const r=new SR();s.rec=r;r.lang='en-US';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;s.timer=setTimeout(()=>{if(s.voice==='starting'){s.voiceMessage='Браузер всё ещё подключает микрофон. Пока не говори.';practice()}},1800);r.onstart=()=>{clearTimeout(s.timer);s.timer=null;s.voice='listening';s.voiceMessage='';practice()};r.onresult=e=>{let interim='',final='';for(let i=e.resultIndex;i<e.results.length;i++){const tr=e.results[i][0]?.transcript||'';e.results[i].isFinal?final+=tr:interim+=tr}if(interim){s.interim=interim;practice()}if(final){s.transcript=final.trim();s.interim='';practice();setTimeout(()=>submit(s.transcript,'voice'),250)}};r.onerror=e=>{clearTimeout(s.timer);s.voice='idle';s.voiceMessage=e.error==='not-allowed'?'Нет доступа к микрофону. Разреши микрофон для этой страницы или используй ввод текста.':'Голосовой ввод не сработал. Попробуй ещё раз или напечатай ответ.';s.typed=true;practice()};r.onend=()=>{clearTimeout(s.timer);if(s.voice!=='idle'){s.voice='idle';if(!s.transcript&&!s.feedback){s.voiceMessage='Речь не распознана. Нажми кнопку ещё раз или напечатай ответ.';practice()}}};try{r.start()}catch{s.voice='idle';s.voiceMessage='Не удалось запустить микрофон. Попробуй ещё раз или напечатай ответ.';s.typed=true;practice()}}
function submit(raw,source){const original=String(raw||'').trim();if(!original)return;s.transcript=original;s.interim='';s.voice='idle';s.voiceMessage='';const item=s.module.items[s.index],e=evaluate(s.module,item,original);e.attempt=s.attempt;e.source=source;e.item=s.index;s.events.push(e);s.feedback=e;practice();wireFeedback()}
function wireFeedback(){const r=document.getElementById('retry');if(r)r.onclick=()=>{s.attempt++;s.hint=Math.min(2,s.hint+1);s.feedback=null;s.transcript='';s.voiceMessage='';practice()};const sh=document.getElementById('show');if(sh)sh.onclick=()=>{s.feedback={kind:'note',title:'Варианты показаны',body:'Эта попытка не считается самостоятельной.',independent:false};practice();wireFeedback()};const n=document.getElementById('next');if(n)n.onclick=()=>{if(s.index<5){s.index++;s.attempt=0;s.hint=0;s.feedback=null;s.transcript='';s.interim='';s.voiceMessage='';s.typed=false;practice()}else{s.view='result';render()}}}
function result(){resetVoice();const first=[];for(let i=0;i<6;i++){const e=s.events.find(x=>x.item===i&&x.attempt===0);if(e)first.push(e)}const accepted=first.filter(e=>e.kind==='accept'||e.kind==='note').length,independent=first.filter(e=>e.independent).length,final=first.find(e=>e.item===5),finalOK=final&&(final.kind==='accept'||final.kind==='note'),helped=6-independent,summary=independent>=5?'Конструкция в большинстве ситуаций приходит сама.':independent>=3?'Конструкция уже появляется самостоятельно, но пока не во всех ситуациях.':'Пока конструкция часто требует подсказки — стоит ещё потренировать.';app.innerHTML=`<div class="darkpage"><div class="wrap"><div class="eyebrow" style="color:#fbbf24">Итог тренировки</div><h1>${s.module.name}</h1><div class="metrics"><div class="metric"><div class="label">Сколько раз получилось сразу</div><strong>${accepted}/6</strong><div class="desc">В этих ситуациях ответ был принят с первой попытки.</div></div><div class="metric"><div class="label">Сколько раз конструкция пришла сама</div><strong>${independent}/6</strong><div class="desc">Без подсказки и без повторного круга.</div></div><div class="metric"><div class="label">Последняя проверка без подсказки</div><strong>${finalOK?'Получилось':'Пока нет'}</strong><div class="desc">Проверили, всплыла ли конструкция сама в последней новой ситуации.</div></div></div><div class="summary"><b>Что это значит</b><div style="margin-top:8px;color:#cbd5e1">${summary}${helped?` Подсказка понадобилась в ${helped} из 6 ситуаций.`:''}</div></div><div class="actions"><button class="btn primary" id="library">К библиотеке</button></div></div></div>`;document.getElementById('library').onclick=()=>{s.view='library';render()}}
render();
</script></body></html>
